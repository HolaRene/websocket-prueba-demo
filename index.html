<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websocket prueba flexi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #121212;
            color: #fff;
        }

        #log {
            background: #000;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            border: 1px solid #333;
        }

        .status-on {
            color: lightgreen;
        }

        .status-off {
            color: red;
        }
    </style>
</head>

<body>
    <h1>WebSocket Prueba demo</h1>
    <h2 id="estatus" class="status-on">Conectando...</h2>
    <form id="message_form">
        <input type="text" name="" id="inputMessage" placeholder="Escribe tu mensaje aquí" required />
        <button type="submit">Enviar Mensaje</button>
    </form>
    <h3>En vivo los mensajes:</h3>
    <pre id="log"></pre>
</body>
<script>
    const logElement = document.getElementById('log');
    const inputMessage = document.getElementById('inputMessage');
    const estatus_el = document.getElementById('estatus');
    // Iniciar el handshake WebSocket
    const ws = new WebSocket('ws://localhost:8080');

    const appendLog = (label, message) => {
        const entrada = `${new Date().toLocaleTimeString()} - ${label}: ${message}\n`;
        logElement.textContent = entrada + logElement.textContent;
    };

    ws.addEventListener('open', () => {
        estatus_el.textContent = 'Conectado al servidor WebSocket en ws://localhost:8080';
        estatus_el.className = 'status-on';
        appendLog('[Sistema]', 'Conexión establecida con el servidor WebSocket puerto 8080');
    });

    ws.addEventListener('message', (event) => {
        appendLog('[Recibido]', event.data);
    });

    ws.addEventListener('close', () => {
        estatus_el.textContent = 'Desconectado del servidor WebSocket';
        estatus_el.className = 'status-off';
        appendLog('[Sistema]', 'Conexión cerrada con el servidor WebSocket');
    });
    document.getElementById('message_form').addEventListener('submit', (e) => {
        e.preventDefault();
        if (ws.readyState !== WebSocket.OPEN) {
            appendLog('[Error]', 'No se puede enviar el mensaje. La conexión no está abierta.');
        }
        const message = inputMessage.value.trim();
        ws.send(message);
        appendLog('[Enviado]', message);
        inputMessage.value = '';
    });
</script>

</html>
